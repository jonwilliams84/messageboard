stages:
  - test
  - build

variables:
  GIT_DEPTH: "10"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

.node:
  image: node:22-alpine
  cache:
    key:
      files:
        - $CI_PROJECT_DIR/$WORKDIR/package-lock.json
    paths:
      - $WORKDIR/node_modules/
  before_script:
    - cd "$WORKDIR"
    - npm install

test:web:
  extends: .node
  stage: test
  variables:
    WORKDIR: web
  script:
    - npm run lint
    - npm run build
    - npm test --if-present

test:api:
  extends: .node
  stage: test
  variables:
    WORKDIR: api
  before_script:
    - apk add --no-cache python3 make g++
    - cd "$WORKDIR"
    - npm install
  script:
    - npm run lint
    - npm run build
    - npm test --if-present

build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: [test:web, test:api]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      { "auths": { "$CI_REGISTRY": { "auth": "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)" } } }
      EOF
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --cache=true
